eval_batch_size: 512
now: ${now:%Y-%m-%d}/${now:%H-%M-%S}
resume: false
mode: all
seed: 0
PROJECT_NAME: score-sde
work_dir: ${hydra:runtime.cwd}
data_dir: ${work_dir}/data/
ckpt_dir: ckpt
logs_dir: logs
logdir: ${work_dir}/results
train_val: true
train_plot: true
test_val: true
test_test: true
test_plot: true
num_workers: 8
paths:
  experiments: results
n_jobs: 2
manifold:
  _target_: geomstats.geometry.hypersphere.Hypersphere
  dim: 2
transform:
  _target_: score_sde.models.Id
flow:
  _target_: riemannian_score_sde.sde.Brownian
  'N': 100
base:
  _target_: riemannian_score_sde.models.distribution.DefaultDistribution
pushf:
  _target_: score_sde.models.flow.SDEPushForward
  diffeq: sde
loss:
  _target_: riemannian_score_sde.losses.get_dsm_loss_fn
  like_w: false
  eps: ${eps}
  thresh: 0.5
  n_max: 5
generator:
  _target_: riemannian_score_sde.models.DivFreeGenerator
dataset:
  _target_: riemannian_score_sde.datasets.vMFDataset
  _convert_: partial
  batch_dims:
  - ${batch_size}
  mu:
  - 1.0
  - 0.0
  - 0.0
  kappa: 15.0
  manifold: ${manifold}
architecture:
  _target_: score_sde.models.Concat
  hidden_shapes:
  - 512
  - 512
  - 512
  - 512
  - 512
  act: sin
embedding:
  _target_: riemannian_score_sde.models.NoneEmbedding
name: s2_toy
batch_size: 512
warmup_steps: 100
steps: 5000
val_freq: 500
ema_rate: 0.999
eps: 0.001
logger:
  csv:
    _target_: score_sde.utils.loggers_pl.CSVLogger
    save_dir: logs
    name: ''
    flush_logs_every_n_steps: 1000
optim:
  _target_: optax.adam
  learning_rate: 0.0002
  b1: 0.9
  b2: 0.999
  eps: 1.0e-08
scheduler:
  _target_: optax.join_schedules
  schedules:
  - _target_: optax.linear_schedule
    init_value: 0.0
    end_value: 1.0
    transition_steps: ${warmup_steps}
  - _target_: optax.cosine_decay_schedule
    init_value: 1.0
    decay_steps: ${eval:${steps}-${warmup_steps}}
    alpha: 0.0
  boundaries:
  - ${warmup_steps}
beta_schedule:
  _target_: score_sde.schedule.LinearBetaSchedule
  beta_0: 0.001
  beta_f: 5.0
  t0: 0.0
  tf: 1.0
